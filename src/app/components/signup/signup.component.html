<form class="px-5 d-flex flex-column align-items-center" [formGroup]="signupForm" (ngSubmit)="onSubmit()">
  <div class="form-floating mb-3 col-10">
    <input type="email" [class]="`form-control ${validationMessages().email && 'is-invalid'}`" name="email" id="email"
      placeholder="username@example.com" formControlName="email" autocomplete="email" required focus />
    <label for="email"><i class="fa fa-envelope"></i> Email</label>

    @if (validationMessages().email) {
    <div class="invalid-feedback">
      {{validationMessages().email}}
    </div>
    }

  </div>

  <div class="form-floating mb-3 col-10">
    <input type="password" [class]="`form-control ${validationMessages().password && 'is-invalid'}`" name="password"
      id="password" placeholder="Your password" formControlName="password" autocomplete="new-password" required />
    <label for="password"><i class="fa fa-lock"></i> Password</label>

    @if (validationMessages().password) {
    <div class="invalid-feedback">
      {{validationMessages().password}}
    </div>
    }
  </div>

  <div class="form-floating mb-3 col-10">
    <input type="text" [class]="`form-control ${validationMessages().password && 'is-invalid'}`" name="name" id="name"
      placeholder="username" formControlName="name" autocomplete="username" required />
    <label for="name"><i class="fa fa-user"></i> Name</label>

    @if (validationMessages().name) {
    <div class="invalid-feedback">
      {{validationMessages().name}}
    </div>
    }
  </div>

  <div class="mb-3 col-10">
    <select class="form-select" name="Role" id="role" formControlName="role">
      @for (role of roles; track $index) {
      <option [selected]="signupForm.value.role === role" [value]="role">{{ role.toLowerCase() }}</option>
      }
    </select>
  </div>

  <app-button variant="secondary" type="submit" [isLoading]="state.isLoading" [disabled]="!signupForm.valid">
    Se connecter
  </app-button>

  <p class="mt-3 text-center">
    Already have an account? <a routerLink="/auth/login">Log in</a>.
  </p>
</form>
