<form class="px-5 d-flex flex-column align-items-center" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <div class="form-floating mb-3 col-10">
    <input type="email" [class]="`form-control ${validationMessages().email && 'is-invalid'}`" name="email" id="email"
      placeholder="username@example.com" formControlName="email" autocomplete="email" required focus />
    <label for="email"><i class="fa fa-envelope"></i> Email</label>

    @if (validationMessages().email) {
    <div class="invalid-feedback">
      {{validationMessages().email}}
    </div>
    }

  </div>

  <div class="form-floating mb-3 col-10">
    <input type="password" [class]="`form-control ${validationMessages().password && 'is-invalid'}`" name="password" id="password"
      placeholder="username@example.com" formControlName="password" autocomplete="current-password" required focus />
    <label for="password"><i class="fa fa-lock"></i> Password</label>

    @if (validationMessages().password) {
    <div class="invalid-feedback">
      {{validationMessages().password}}
    </div>
    }
  </div>

  <app-button variant="primary" type="submit" [isLoading]="state.isLoading" [disabled]="!loginForm.valid">
    Se connecter
  </app-button>

  <p class="mt-3 text-center">
    Vous n'avez pas de compte ? <a routerLink="/auth/signup">Créez-en un</a>.
  </p>
</form>
